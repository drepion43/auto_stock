[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto_stock"
version = "0.1.0"
description = "Stock recommendation and semi-automatic trading system"
requires-python = ">=3.11"
dependencies = [
    "finance-datareader",
    "pykrx",
    "duckdb",
    "apscheduler",
    "pandas",
    "pandas-ta",
    "requests",
    "python-dotenv",
    "scikit-learn>=1.4",
    "joblib",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: model-fitting smoke tests (training wiring) — excluded via `-m \"not slow\"` for fast runs",
]
