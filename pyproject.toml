[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto_stock"
version = "0.1.0"
description = "Stock recommendation and semi-automatic trading system"
requires-python = ">=3.12"
dependencies = [
    "finance-datareader",
    "pykrx",
    "duckdb",
    "apscheduler",
    "pandas",
    "pandas-ta",
    "requests",
    "python-dotenv",
    "scikit-learn>=1.4",
    "joblib",
    "numpy",
    # ml_predictor의 production 모델(Mamba SSM, src/auto_stock/ml_predictor/mamba_block.py)이
    # PyTorch 기반이다. 추론은 CPU로 충분하고, 학습은 GPU가 있으면 GPU를 쓴다
    # (training.py::resolve_device). Windows의 CUDA 빌드는 아래 [tool.uv.sources] 참고.
    "torch",
    "tqdm",
    # 학습 곡선 PNG(ml_predictor/reporting.py). 기존에도 간접 의존성으로 설치돼 있었다.
    "matplotlib",
    "openai>=3.5,<4",
    "defusedxml",
    "pydantic>=2",
    # 메인 루프가 deepagents/LangGraph 미들웨어 동작(병렬 도구 실행, ModelCallLimit 등)에 직접
    # 의존하므로 마이너 업그레이드를 막는다(결정 D15, docs/design/main-agent-migration-plan.md §4.1).
    "deepagents>=0.7.13,<0.8",
    "langchain>=1.4,<1.5",
    "langgraph>=1.2,<1.3",
    "langchain-openai>=1.6.0,<1.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "deepeval==4.3.1",
]

# PyPI의 Windows용 torch는 CPU 빌드뿐이라 Windows에서만 PyTorch CUDA 13.0 인덱스를 쓴다.
# cu130은 RTX 50(Blackwell, sm_120)을 지원하고 드라이버 CUDA 13.x와 맞는다. Linux PyPI torch는
# 이미 CUDA 포함, macOS는 CPU/MPS라 그대로 둔다. GPU 없는 Windows에서도 CPU로 정상 동작한다.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: model-fitting smoke tests (training wiring) — excluded via `-m \"not slow\"` for fast runs",
]
