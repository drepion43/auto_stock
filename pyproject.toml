[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto_stock"
version = "0.1.0"
description = "Stock recommendation and semi-automatic trading system"
requires-python = ">=3.12"
dependencies = [
    "finance-datareader",
    "pykrx",
    "duckdb",
    "apscheduler",
    "pandas",
    "pandas-ta",
    "requests",
    "python-dotenv",
    "scikit-learn>=1.4",
    "joblib",
    "numpy",
    # ml_predictor의 production 모델(Mamba SSM, src/auto_stock/ml_predictor/mamba_block.py)이
    # PyTorch 기반이다 — CPU 전용으로 충분하다(기존 파이프라인 전체가 CPU 전제, GPU 코드 없음).
    "torch",
    "tqdm",
    "openai>=3.5,<4",
    "defusedxml",
    "pydantic>=2",
    # 메인 루프가 deepagents/LangGraph 미들웨어 동작(병렬 도구 실행, ModelCallLimit 등)에 직접
    # 의존하므로 마이너 업그레이드를 막는다(결정 D15, docs/design/main-agent-migration-plan.md §4.1).
    "deepagents>=0.7.13,<0.8",
    "langchain>=1.4,<1.5",
    "langgraph>=1.2,<1.3",
    "langchain-openai>=1.6.0,<1.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: model-fitting smoke tests (training wiring) — excluded via `-m \"not slow\"` for fast runs",
]
